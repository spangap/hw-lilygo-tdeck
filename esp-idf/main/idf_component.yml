dependencies:
  idf:
    version: ">=5.5"

  # Platform straddles (spangap-core/-net/-web/-lcd, wg, upnp, duckdns, acme,
  # ota) and reticulous feature straddles (rns, tr-tcp/
  # -auto/-espnow/-lora, lxmf, nomad, maps) are NOT
  # listed here. They're declared in straddle.yaml's `requires:` and staged
  # at build time by `spangap make` into staging/components/<short>/, picked
  # up via EXTRA_COMPONENT_DIRS. Listing them here too would double-stage
  # them under the manager's namespaced `managed_components/<org>__<repo>/`
  # form, causing duplicate-symbol link errors.
  #
  # The component manager doesn't recurse into locally-staged components'
  # dependencies, so the buildable straddle has to surface every third-party
  # managed dep that any of its required straddles transitively uses
  # (radiolib for tr-lora, esp_jpeg for reticulous/maps). LVGL is
  # the exception — it's a registry component, not a straddle, so it's
  # pinned in spangap-lcd's own idf_component.yml and reaches us through
  # the normal managed-component recursion.

  jgromes/radiolib:
    version: "^7.0.0"
  # On-device LCD UI (CONFIG_SPANGAP_LCD): GT911 touch driver for the board
  # HAL. LVGL itself is pinned by spangap-lcd. esp_lcd_touch_gt911 pulls in
  # esp_lcd_touch transitively, which spangap-lcd's CMakeLists.txt links
  # against under CONFIG_SPANGAP_LCD.
  espressif/esp_lcd_touch_gt911:
    version: "^1.1"
