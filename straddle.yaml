# reticulous-tdeck — buildable straddle that builds the device image for the
# LilyGo T-Deck Plus.
#
# Owns the T-Deck Plus board HAL (tdeck.cpp/h: power/CS/reset, display/
# touch/trackball/button HAL, QWERTY keyboard) and the GNSS receiver task
# (gps.cpp/h — board-specific until a GPS service abstraction earns its
# own straddle). The partition layout, OTA pubkey, app_main (which drives
# the explicit per-straddle init() sequence) and the Quasar browser SPA
# shell all live here.
schema_version: 1
name: reticulous/reticulous-tdeck
prefix: tdeck
version: 0.1.0
firmware: esp-idf
browser: web-interface
platforms: [idf]
requires:
  - reticulous/reticulous-core
  - reticulous/reticulous-tcp
  - reticulous/reticulous-auto
  - reticulous/reticulous-espnow
  - reticulous/reticulous-lora
  - reticulous/reticulous-lxmf
  - reticulous/reticulous-nomad
  - reticulous/maps
  - spangap/spangap-core
  - spangap/spangap-net
optional_requires:
  # Default-on; drop with `spangap build --exclude <name>` (or the --no-lcd /
  # --no-web shorthands). Each call site in main.cpp and each integrating
  # straddle gates on the corresponding CONFIG_SPANGAP_<NAME> shortcut, so
  # absence compiles away cleanly.
  - spangap/spangap-lcd
  - spangap/spangap-web
  - spangap/wg
  - spangap/upnp
  - spangap/duckdns
  - spangap/acme
extra_requires:
  # Default-off; add with `spangap build --include spangap/ota`. OTA halves
  # the available flash (paired A/B partitions) and is currently lightly
  # tested, so it's opt-in rather than opt-out for now.
  - spangap/ota
buildable:
  name: reticulous
  partition_layout: partitions.csv
