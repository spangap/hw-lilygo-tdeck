# hw-tdeck — board HAL straddle for the LilyGo T-Deck Plus.
#
# A plain (non-buildable) board component: it doesn't decide what the device
# DOES, it only makes the T-Deck usable by an app. The reticulous/reticulous
# buildable adds it with `--with reticulous/hw-tdeck` and inherits the board's
# pin maps, bring-up hooks and hardware kconfig.
#
# Owns the T-Deck Plus board HAL (esp-idf/src/tdeck.cpp: power/CS/reset, display/
# touch/trackball/button input HAL, QWERTY keyboard) + the GNSS receiver
# (gps.cpp) + RTC (rtc.cpp). app_main, partitions, the OTA story and the browser
# SPA are NOT here — they belong to the buildable.
schema_version: 1
name: reticulous/hw-tdeck
prefix: tdeck
firmware: esp-idf
version: 0.1.0
platforms: [idf]
# The one thing this board pulls in: the on-device LCD UI, because the T-Deck
# physically has a screen. Everything else (the mesh, the IP/web platform) comes
# from the reticulous/reticulous buildable. Drop the UI with --no-lcd.
additional_installs:
  - spangap/spangap-lcd
# Board bring-up hooks. app_main is generated by the buildable; the build's
# start/init dispatchers call these. tdeckStart() is bare-hardware (peripheral
# power rail, shared-SPI CS park) and MUST precede spangapInit()'s fs_mount_sd(),
# so it is a start: hook. The on-device-UI input HAL + keyboard live in
# conditional/spangap-lcd/ (compiled only when lcd is staged) and run as when:
# spangap/spangap-lcd hooks: tdeckLcdStart (start: band, input HAL register
# before lcdInit) and tdeckLcdInit (init: band, keyboard, needs the lcd task).
# gpsInit() (GNSS) needs the platform up, so it is an init: hook. No #if anywhere.
start:
  - call: tdeckStart
  - call: tdeckLcdStart
    when: spangap/spangap-lcd
init:
  - call: tdeckLcdInit
    when: spangap/spangap-lcd
  # ES7210 mic control shim (esp-idf/conditional/audio/) — only emitted/linked
  # when the spangap/audio engine is staged. Registers the I2C codec ops; the
  # audio task applies them lazily on first capture.
  - call: tdeckAudioInit
    when: spangap/audio
  - call: gpsInit
  # Battery ADC monitor (esp-idf/src/tdeck.cpp): arms a 1/min esp_timer that
  # publishes battery.millivolt / battery.percent. Always on — no UI dependency.
  - call: tdeckBatteryInit

# Declarative settings: the "T-Deck" pane + s.tdeck.* defaults are generated from
# this block (the web panel is generated too — there is no hand-written one).
# gps.* and s.lcd.* rows are defaultless: those defaults are owned by gps.cpp and
# spangap-lcd respectively; this pane only surfaces the keys.
settings:
  - menu:
      - { id: tdeck, label: "T-Deck" }
    rows:
      - section: "Board"
      - value:  { label: "GPS",   key: "gps.model" }
      - value:  { label: "Touch", key: "tdeck.touch" }
      - section: "GPS"
      - switch: { label: "Enable",       key: "s.gps.enable" }
      - slider: { label: "Interval (s)", key: "s.gps.interval", min: 0, max: 10 }
      - value:  { label: "Status",       key: "gps.state" }
      - section: "Trackball"
      - slider: { label: "Pointer speed",    key: "s.tdeck.trackball_speed",      min: 4, max: 40, default: 16 }
      - slider: { label: "Cursor dwell (s)", key: "s.tdeck.pointer_visible_time", min: 1, max: 30, default: 2 }
      - section: "Centre button"
      - slider: { label: "Launcher hold (ms)", key: "s.tdeck.launcher_hold_ms", min: 0, max: 1000, default: 300 }
      - slider: { label: "Standby hold (ms)",  key: "s.tdeck.standby_hold_ms",  min: 0, max: 1000, default: 1000 }
      - section: "Display"
      - slider: { label: "Backlight",       key: "s.lcd.backlight",          min: 0, max: 255 }
      - slider: { label: "Sleep after (s)", key: "s.lcd.inactivity_timeout", min: 0, max: 120 }

# Board VALUES, fed to the symbols other straddles / IDF DEFINE through the
# collected staging/sdkconfig.spangap-fragments. A board straddle is non-
# buildable, so its sdkconfig.defaults would be IGNORED — everything that
# describes this hardware MUST live here in kconfig: to survive `--with`.
kconfig:
  # Board memory: 16 MB flash, 8 MB octal PSRAM (ESP32-S3FN16R8).
  # Flash size is pinned to the board's real 16 MB. The T-Deck is always a 16 MB
  # part, so there's no reason to ship the cramped 4 MB floor image (whose
  # app+fixed must fit under 4 MB — the full feature set was already at ~4% free).
  # Pinning builds for the full 16 MB: the build-time partition ceiling moves to
  # 16 MB so app/fixed grow freely. `state` is unchanged — statePartitionEnsure()
  # (fs.cpp) still reads the real physical size via SFDP and registers it in the
  # upper half of flash at runtime.
  - CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y
  - CONFIG_SPIRAM_MODE_OCT=y
  # PSRAM runs at spangap-core's 80 MHz default. (Briefly tried 40 MHz chasing
  # `cat`-during-flash crashes, but those were PSRAM-*placement* bugs — FreeRTOS
  # control structures wrongly in PSRAM — not MSPI timing; see docs/memory.md.
  # 40 MHz changed nothing and only halved read bandwidth, so reverted.)
  # SD card on the shared FSPI bus (pins shared with LoRa + LCD; spangap's
  # spi_helper arbitrates the bus).
  - CONFIG_SPANGAP_SDCARD=y
  - CONFIG_SPANGAP_SDCARD_BUS_SPI=y
  - CONFIG_SPANGAP_SDCARD_SPI_HOST=2
  - CONFIG_SPANGAP_SDCARD_SPI_PIN_CS=39
  - CONFIG_SPANGAP_SDCARD_SPI_PIN_SCK=40
  - CONFIG_SPANGAP_SDCARD_SPI_PIN_MOSI=41
  - CONFIG_SPANGAP_SDCARD_SPI_PIN_MISO=38
  # One SX1262 LoRa modem on the same FSPI bus (host/SCK/MOSI/MISO match SD).
  # TCXO is 1.8 V; the SX1262 drives DIO2 as its own antenna switch.
  - CONFIG_LORA_COUNT=1
  - CONFIG_LORA_SPI_HOST=2
  - CONFIG_LORA_SCK_PIN=40
  - CONFIG_LORA_MOSI_PIN=41
  - CONFIG_LORA_MISO_PIN=38
  - CONFIG_LORA0_CS_PIN=9
  - CONFIG_LORA0_DIO1_PIN=45
  - CONFIG_LORA0_BUSY_PIN=13
  - CONFIG_LORA0_RST_PIN=17
  - CONFIG_LORA0_TCXO_MV=1800
  - CONFIG_LORA0_DIO2_RF_SWITCH=y
  - CONFIG_LORA0_RADIO_SX1262=y
  # Display — T-Deck Plus 2.8" ST7789 320x240 on the shared FSPI bus (host/SCK/
  # MOSI/MISO match the SD block). No dedicated panel reset (LCD_RST stays -1;
  # the panel resets with the board power rail). Inert when --no-lcd.
  - CONFIG_LCD_SPI_HOST=2
  - CONFIG_LCD_SCK_PIN=40
  - CONFIG_LCD_MOSI_PIN=41
  - CONFIG_LCD_MISO_PIN=38
  - CONFIG_LCD_CS_PIN=12
  - CONFIG_LCD_DC_PIN=11
  - CONFIG_LCD_BL_PIN=42
  - CONFIG_LCD_PCLK_MHZ=40
  - CONFIG_LCD_CONTROLLER_ST7789=y
  - CONFIG_LCD_NATIVE_WIDTH=240
  - CONFIG_LCD_NATIVE_HEIGHT=320
  - CONFIG_LCD_ROTATION_90=y
  - CONFIG_LCD_INVERT_COLOR=y
  # LVGL v9 tuning. 16-bit colour matches the panel (we byte-swap RGB565 in the
  # flush callback, so LV_COLOR_16_SWAP stays off). Montserrat 12 for launcher
  # labels. LVGL allocations route through spangap's central policy (mem.h /
  # gp_alloc → PSRAM on PSRAM targets, internal on no-PSRAM ones) via
  # LV_USE_CUSTOM_MALLOC + lv_mem_spangap.cpp, instead of the C heap directly.
  - CONFIG_LV_COLOR_DEPTH_16=y
  - CONFIG_LV_USE_CUSTOM_MALLOC=y
  - CONFIG_LV_USE_CLIB_STRING=y
  - CONFIG_LV_FONT_MONTSERRAT_12=y
  # Audio (consumed by spangap/audio when staged). ES7210 quad-mic ADC on I2S0
  # (standard I2S, S3 as master), MAX98357A speaker on I2S1. The two pin sets are
  # disjoint, so capture and playback run as true full-duplex on two independent
  # I2S controllers. GPIO 21 is the ES7210 word-select only; the self-clocking
  # MAX98357A has no MCLK input and never touches it, so nothing contends.
  # (A board's sdkconfig.defaults is ignored — these MUST live in kconfig:.)
  - CONFIG_AUDIO_OUT_ENABLE=y
  - CONFIG_AUDIO_IN_ENABLE=y
  - CONFIG_AUDIO_IN_MODE_STD=y
  - CONFIG_AUDIO_OUT_I2S_PORT=1
  - CONFIG_AUDIO_OUT_BCK_GPIO=7
  - CONFIG_AUDIO_OUT_WS_GPIO=5
  - CONFIG_AUDIO_OUT_DOUT_GPIO=6
  - CONFIG_AUDIO_IN_I2S_PORT=0
  - CONFIG_AUDIO_IN_MCLK_GPIO=48
  - CONFIG_AUDIO_IN_SCK_GPIO=47
  - CONFIG_AUDIO_IN_WS_GPIO=21
  - CONFIG_AUDIO_IN_DIN_GPIO=14
  - CONFIG_AUDIO_RATE_DEFAULT=16000
