# hw-lilygo-tdeck — board HAL straddle for the LilyGo T-Deck Plus.
#
# A plain (non-buildable) board component: it doesn't decide what the device
# DOES, it only makes the T-Deck usable by an app. The reticulous/reticulous
# buildable adds it with `--with spangap/hw-lilygo-tdeck` and inherits the board's
# pin maps, bring-up hooks and hardware kconfig.
#
# Owns the T-Deck Plus board HAL (esp-idf/src/tdeck.cpp: power/CS/reset, display/
# touch/trackball/button input HAL, QWERTY keyboard). The GNSS receiver is the
# generic spangap/gps straddle — this board only stages it and supplies
# its pins. app_main, partitions, the OTA story and the browser SPA are NOT
# here — they belong to the buildable.
schema_version: 1
name: spangap/hw-lilygo-tdeck
prefix: tdeck
firmware: esp-idf
version: 0.0.0
platforms: [idf]
# The one thing this board pulls in: the on-device LCD UI, because the T-Deck
# physically has a screen. Everything else (the mesh, the IP/web platform) comes
# from the reticulous/reticulous buildable. Drop the UI with --no-lcd.
additional_installs:
  - spangap/spangap-lcd
  # The T-Deck has audio hardware (ES7210 mic + MAX98357A speaker), so the board
  # provides the audio engine — the same way its screen brings in spangap-lcd.
  # Any buildable on this board gains audio; consumers gate their use on
  # CONFIG_STRADDLE_AUDIO (e.g. lxmf's notification ping). Boards without audio
  # hardware never stage it, so the engine only runs where the hardware exists.
  - spangap/audio
  # The Plus has a GNSS receiver pre-soldered to the Grove header, so the board
  # stages the generic GNSS straddle; its pins are supplied in kconfig: below.
  - spangap/gps
# Board bring-up as registered Services. app_main is generated by the buildable;
# it constructs these in listed order and walks them (onStart before spangapInit,
# onInit after). ORDER MATTERS — it reproduces the old start/init bands exactly:
#   TdeckBoard.onStart (was tdeckStart) — bare-hardware power rail + shared-SPI CS
#     park; MUST precede spangapInit()'s fs_mount_sd(). Its onInit publishes
#     sys.board, which needs storage and so cannot happen in the start band.
#   TdeckLcdInput (conditional/spangap-lcd/, when spangap-lcd): onStart (was
#     tdeckLcdStart) registers the input HAL before lcdInit; onInit (was
#     tdeckLcdInit) brings up the keyboard once the lcd task exists.
#   TdeckAudio (conditional/audio/, when spangap/audio): onInit (was
#     tdeckAudioInit) registers the ES7210 codec ops; the audio task applies them
#     lazily on first capture. Only compiled/linked when the audio engine is staged.
#   TdeckBattery.onInit (was tdeckBatteryInit) — 1/min esp_timer publishing
#     battery.millivolt / battery.percent. Always on — no UI dependency.
# The when:-gated entries vanish entirely when their straddle isn't staged. TdeckBoard
# is first in the init walk too, so sys.board is published before anything reads it.
# No #if anywhere. (The GNSS task is gps's own GpsService, registered at
# that straddle's init_order position, not listed here.)
services:
  - { class: TdeckBoard,    header: tdeck.h }
  - { class: TdeckLcdInput, header: tdeck_lcd.h,   when: spangap/spangap-lcd }
  - { class: TdeckAudio,    header: tdeck_audio.h, when: spangap/audio }
  - { class: TdeckBattery,  header: tdeck.h }

# Declarative settings: the board's rows on the System page + the s.tdeck.*
# defaults are generated from this block (the web panels too — there is no
# hand-written one). What this board offers is device-wide, not a program, so it
# lands on System rather than in a menu of its own; the orders put Hardware and
# Display at the top, ahead of the unordered blocks the platform straddles
# contribute there, and keep the board's remaining sections together below them.
# The Display rows join the section spangap-lcd opens — section titles merge on
# an exact match, so a board states only the panel rows it actually has.
# s.lcd.* rows are defaultless: those defaults are owned by spangap-lcd; this
# block only surfaces the keys. (The GPS section is gps's own
# contribution, at order 30 — between Display and Trackball here.)
settings:
  - at: [ { id: system } ]
    order: 10
    rows:
      - section: "Hardware"
      - info:
          rows:
            - value:  { label: "Board", key: "sys.board" }
            - value:  { label: "Touch", key: "tdeck.touch" }
  - at: [ { id: system } ]
    order: 20
    rows:
      - section: "Display"
      - slider: { label: "Backlight",       key: "s.lcd.backlight",          min: 0, max: 255 }
      - integer: { label: "Dim after", unit: "s",  key: "s.lcd.inactivity_timeout", min: 0, max: 120 }
  - at: [ { id: system } ]
    order: 40
    rows:
      - section: "Trackball"
      - slider: { label: "Pointer speed",    key: "s.tdeck.trackball_speed",      min: 4, max: 40, default: 16 }
      - integer: { label: "Cursor dwell", unit: "s", key: "s.tdeck.pointer_visible_time", min: 1, max: 30, default: 2 }

# Board VALUES, fed to the symbols other straddles / IDF DEFINE through the
# collected staging/sdkconfig.spangap-fragments. A board straddle is non-
# buildable, so its sdkconfig.defaults would be IGNORED — everything that
# describes this hardware MUST live here in kconfig: to survive `--with`.
kconfig:
  # Board memory: 16 MB flash, 8 MB octal PSRAM (ESP32-S3FN16R8). Two numbers:
  #   * FLASHSIZE — the flash CONTAINER / bootloader-header size. Pinned to the
  #     board's real 16 MB so the header matches the chip (no esptool size-mismatch
  #     warning) and the build can report a concrete /state size. /state starts at
  #     the floor below, NOT the container, so this no longer has to be < the chip
  #     as it briefly did under the earlier state-at-container design.
  #   * MAX_FIRMWARE_KB — the byte-granular MAXIMUM FIRMWARE SIZE = the offset where
  #     /state begins. 6 MB = app+fixed (~3.7 MB) plus ~2.2 MB of growth headroom.
  #     /state fills the rest of the real chip → ~10 MB here.
  # Changing MAX_FIRMWARE_KB relocates /state → existing devices factory-reset on
  # the next boot, so warn users before bumping it.
  - CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y
  - CONFIG_SPANGAP_MAX_FIRMWARE_KB=8192
  - CONFIG_SPIRAM_MODE_OCT=y
  # PSRAM runs at spangap-core's 80 MHz default. (Briefly tried 40 MHz chasing
  # `cat`-during-flash crashes, but those were PSRAM-*placement* bugs — FreeRTOS
  # control structures wrongly in PSRAM — not MSPI timing; see docs/memory.md.
  # 40 MHz changed nothing and only halved read bandwidth, so reverted.)
  # SD card on the shared FSPI bus (pins shared with LoRa + LCD; spangap's
  # spi_helper arbitrates the bus).
  - CONFIG_SPANGAP_SDCARD=y
  - CONFIG_SPANGAP_SDCARD_BUS_SPI=y
  - CONFIG_SPANGAP_SDCARD_SPI_HOST=2
  - CONFIG_SPANGAP_SDCARD_SPI_PIN_CS=39
  - CONFIG_SPANGAP_SDCARD_SPI_PIN_SCK=40
  - CONFIG_SPANGAP_SDCARD_SPI_PIN_MOSI=41
  - CONFIG_SPANGAP_SDCARD_SPI_PIN_MISO=38
  # One SX1262 LoRa modem on the same FSPI bus (host/SCK/MOSI/MISO match SD).
  # TCXO is 1.8 V; the SX1262 drives DIO2 as its own antenna switch. Gated on
  # iface-lora: the CONFIG_LORA_* symbols are DEFINED by that straddle's Kconfig,
  # so applying these in a build without it (e.g. spangap/demo) would warn as
  # unknown symbols. Wire them only when the LoRa straddle is actually staged.
  - when: reticulous/iface-lora
    set:
      - CONFIG_LORA_COUNT=1
      - CONFIG_LORA_SPI_HOST=2
      - CONFIG_LORA_SCK_PIN=40
      - CONFIG_LORA_MOSI_PIN=41
      - CONFIG_LORA_MISO_PIN=38
      - CONFIG_LORA0_CS_PIN=9
      - CONFIG_LORA0_DIO1_PIN=45
      - CONFIG_LORA0_BUSY_PIN=13
      - CONFIG_LORA0_RST_PIN=17
      - CONFIG_LORA0_TCXO_MV=1800
      - CONFIG_LORA0_DIO2_RF_SWITCH=y
      - CONFIG_LORA0_RADIO_SX1262=y
  # GNSS receiver (consumed by spangap/gps, staged above) — pre-soldered
  # on the Plus, hard-wired to the Grove header, NMEA over UART1 8N1. The chip is
  # production-batch dependent (Quectel L76K or u-blox MIA-M10Q, no host-visible
  # id — gps autobauds; docs/tdeck.md §1.3). Powered off the shared
  # BOARD_POWER_EN_PIN rail (no independent GPS enable); PPS is not routed on the
  # Plus. Host RX <- GPS TX = 44; host TX -> GPS RX = 43. Gated on gps:
  # the CONFIG_GPS_* symbols are DEFINED by that straddle's Kconfig, so they'd
  # warn as unknown in a build without it.
  - when: spangap/gps
    set:
      - CONFIG_GPS_UART_NUM=1
      - CONFIG_GPS_RX_PIN=44
      - CONFIG_GPS_TX_PIN=43
  # Display — T-Deck Plus 2.8" ST7789 320x240 on the shared FSPI bus (host/SCK/
  # MOSI/MISO match the SD block). No dedicated panel reset (LCD_RST stays -1;
  # the panel resets with the board power rail). Inert when --no-lcd.
  - CONFIG_LCD_SPI_HOST=2
  - CONFIG_LCD_SCK_PIN=40
  - CONFIG_LCD_MOSI_PIN=41
  - CONFIG_LCD_MISO_PIN=38
  - CONFIG_LCD_CS_PIN=12
  - CONFIG_LCD_DC_PIN=11
  - CONFIG_LCD_BL_PIN=42
  - CONFIG_LCD_PCLK_MHZ=40
  - CONFIG_LCD_CONTROLLER_ST7789=y
  - CONFIG_LCD_NATIVE_WIDTH=240
  - CONFIG_LCD_NATIVE_HEIGHT=320
  - CONFIG_LCD_ROTATION_90=y
  - CONFIG_LCD_INVERT_COLOR=y
  # LVGL v9 tuning. 16-bit colour matches the panel (we byte-swap RGB565 in the
  # flush callback, so LV_COLOR_16_SWAP stays off). Montserrat 12 for launcher
  # labels. LVGL allocations route through spangap's central policy (mem.h /
  # gp_alloc → PSRAM on PSRAM targets, internal on no-PSRAM ones) via
  # LV_USE_CUSTOM_MALLOC + lv_mem_spangap.cpp, instead of the C heap directly.
  - CONFIG_LV_COLOR_DEPTH_16=y
  - CONFIG_LV_USE_CUSTOM_MALLOC=y
  - CONFIG_LV_USE_CLIB_STRING=y
  - CONFIG_LV_FONT_MONTSERRAT_12=y
  # Audio (consumed by spangap/audio when staged). ES7210 quad-mic ADC on I2S0
  # (standard I2S, S3 as master), MAX98357A speaker on I2S1. The two pin sets are
  # disjoint, so capture and playback run as true full-duplex on two independent
  # I2S controllers. GPIO 21 is the ES7210 word-select only; the self-clocking
  # MAX98357A has no MCLK input and never touches it, so nothing contends.
  # (A board's sdkconfig.defaults is ignored — these MUST live in kconfig:.)
  # Gated on spangap/audio: the CONFIG_AUDIO_* symbols are DEFINED by that
  # straddle's Kconfig, so they'd warn as unknown in a build without it.
  - when: spangap/audio
    set:
      - CONFIG_AUDIO_OUT_ENABLE=y
      - CONFIG_AUDIO_IN_ENABLE=y
      - CONFIG_AUDIO_IN_MODE_STD=y
      - CONFIG_AUDIO_OUT_I2S_PORT=1
      - CONFIG_AUDIO_OUT_BCK_GPIO=7
      - CONFIG_AUDIO_OUT_WS_GPIO=5
      - CONFIG_AUDIO_OUT_DOUT_GPIO=6
      - CONFIG_AUDIO_IN_I2S_PORT=0
      - CONFIG_AUDIO_IN_MCLK_GPIO=48
      - CONFIG_AUDIO_IN_SCK_GPIO=47
      - CONFIG_AUDIO_IN_WS_GPIO=21
      - CONFIG_AUDIO_IN_DIN_GPIO=14
      - CONFIG_AUDIO_RATE_DEFAULT=16000
