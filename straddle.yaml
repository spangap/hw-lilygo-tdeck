# hw-tdeck — buildable straddle that builds the device image for the
# LilyGo T-Deck Plus.
#
# Owns the T-Deck Plus board HAL (tdeck.cpp/h: power/CS/reset, display/
# touch/trackball/button HAL, QWERTY keyboard) and the GNSS receiver task
# (gps.cpp/h — board-specific until a GPS service abstraction earns its
# own straddle). The partition layout, OTA pubkey, app_main (which calls
# spangapInit() for the platform core, then the build-generated
# spangapInitStraddles() dispatcher to init every staged straddle that declares
# an `init:` hook) and the Quasar browser SPA shell all live here.
schema_version: 1
name: reticulous/hw-tdeck
prefix: tdeck
version: 0.1.0
firmware: esp-idf
browser: web-interface
platforms: [idf]
# No hard requires:. spangap-core is implicit (the empty-prefix platform
# foundation, always staged), and every feature below is optional — this
# buildable is a pure menu, all default-on, any subset droppable. Drop one
# with `spangap build --without <name>` (or --no-lcd / --no-web / --no-net),
# and the cascade takes its hard dependents with it: e.g. --no-net also drops
# web/sshd/upnp/wg/duckdns/acme and the IP transports iface-tcp/-auto/-espnow,
# leaving a LoRa-only image. Every entry declares an `init:` hook, so the
# generated spangapInitStraddles() dispatcher brings it up with no call site in
# main.cpp; when dropped its hook is simply never emitted. (lcd/web also expose
# the CONFIG_SPANGAP_LCD/WEB shortcuts other straddles gate their integration
# slices on.) Absence compiles away cleanly either way.
optional_requires:
  - reticulous/rns
  - reticulous/iface-lora
  - reticulous/iface-tcp
  - reticulous/iface-auto
  - reticulous/iface-espnow
  - reticulous/lxmf
  - reticulous/nomad
  - reticulous/maps
  - spangap/spangap-net
  - spangap/spangap-lcd
  - spangap/spangap-web
  - spangap/sshd
  - spangap/wg
  - spangap/upnp
  - spangap/duckdns
  - spangap/acme
# OTA is not listed here. It halves available flash (paired A/B partitions)
# and is currently lightly tested, so it's left out of the default and
# optional sets. Pull it in ad-hoc with `spangap build --with spangap/ota`.

# Board peripheral pin maps. These set VALUES for symbols the consumer
# straddles DEFINE — CONFIG_SPANGAP_SDCARD_* by spangap-core's SD driver,
# CONFIG_LORA* by iface-lora — and reach them through the collected
# staging/sdkconfig.spangap-fragments. This is what makes hw-tdeck reusable as
# a board straddle for other projects: a downstream `reticulous`-style
# buildable just adds it with `--with` and inherits the T-Deck wiring.

# Board bring-up hooks. app_main is generated (this straddle ships no main.cpp);
# the build's start/init dispatchers call these. tdeckStart() is bare-hardware
# (peripheral power rail, shared-SPI CS park) and MUST precede spangapInit()'s
# fs_mount_sd(), so it is a start: hook. The on-device-UI input HAL + keyboard
# live in conditional/spangap-lcd/ (compiled only when lcd is staged) and run as
# when: spangap/spangap-lcd hooks: tdeckLcdStart (start: band, input HAL register
# before lcdInit) and tdeckLcdInit (init: band, keyboard, needs the lcd task).
# gpsInit() (GNSS) needs the platform up, so it is an init: hook. No #if anywhere.
start:
  - call: tdeckStart
  - call: tdeckLcdStart
    when: spangap/spangap-lcd
init:
  - call: tdeckLcdInit
    when: spangap/spangap-lcd
  - call: gpsInit
kconfig:
  # SD card on the shared FSPI bus (pins shared with LoRa + LCD; spangap's
  # spi_helper arbitrates the bus).
  - CONFIG_SPANGAP_SDCARD=y
  - CONFIG_SPANGAP_SDCARD_BUS_SPI=y
  - CONFIG_SPANGAP_SDCARD_SPI_HOST=2
  - CONFIG_SPANGAP_SDCARD_SPI_PIN_CS=39
  - CONFIG_SPANGAP_SDCARD_SPI_PIN_SCK=40
  - CONFIG_SPANGAP_SDCARD_SPI_PIN_MOSI=41
  - CONFIG_SPANGAP_SDCARD_SPI_PIN_MISO=38
  # One SX1262 LoRa modem on the same FSPI bus (host/SCK/MOSI/MISO match SD).
  # TCXO is 1.8 V; the SX1262 drives DIO2 as its own antenna switch.
  - CONFIG_LORA_COUNT=1
  - CONFIG_LORA_SPI_HOST=2
  - CONFIG_LORA_SCK_PIN=40
  - CONFIG_LORA_MOSI_PIN=41
  - CONFIG_LORA_MISO_PIN=38
  - CONFIG_LORA0_CS_PIN=9
  - CONFIG_LORA0_DIO1_PIN=45
  - CONFIG_LORA0_BUSY_PIN=13
  - CONFIG_LORA0_RST_PIN=17
  - CONFIG_LORA0_TCXO_MV=1800
  - CONFIG_LORA0_DIO2_RF_SWITCH=y
  - CONFIG_LORA0_RADIO_SX1262=y
buildable:
  name: reticulous
  partition_layout: partitions.csv
